<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- rotated maze frame -->
  <g transform="rotate(18 64 64)">
    <rect x="24" y="40" width="80" height="48" rx="8" fill="#1c2532" stroke="#4a5568" stroke-width="5"/>
    <!-- wall -->
    <rect x="58" y="52" width="8" height="36" fill="#4a5568"/>
    <!-- goal -->
    <rect x="76" y="62" width="18" height="16" rx="4" fill="#1d9e55" stroke="#41e58a" stroke-width="3"/>
  </g>
  <!-- ball (falls straight down in screen space) -->
  <circle cx="44" cy="58" r="11" fill="#f5a623" stroke="#7a4a00" stroke-width="2.5"/>
  <circle cx="40.5" cy="54.5" r="3.5" fill="#ffd76a"/>
  <!-- gravity arrow -->
  <g stroke="#41e58a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M96 24 v26"/>
    <path d="M87 41 l9 10 9-10"/>
  </g>
</svg>
